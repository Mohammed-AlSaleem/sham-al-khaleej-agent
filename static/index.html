<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sham Al-Khaleej · Ordering Assistant</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --text:#2b2118; --muted:#7a6a5a; --accent:#b4531f; --border:#e6dccd; --bot:#f1e9dc; --hard:#fbe4dc; --ok:#e3efdc; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#18130f; --card:#221b15; --text:#f0e6d8; --muted:#a8998a; --accent:#e08a4f; --border:#3a2f25; --bot:#2e251d; --hard:#4a2a1f; --ok:#27391f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  header h1 span { color: var(--accent); }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 6px 12px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea { font: inherit; width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: var(--text); }
  #login { max-width: 380px; margin: 14vh auto; padding: 0 16px; text-align: center; }
  #login p { color: var(--muted); }
  #login form { display: flex; flex-direction: column; gap: 10px; }
  .err { color: #c0392b; min-height: 1.4em; font-size: 14px; }
  #app { display: none; height: calc(100% - 55px); grid-template-columns: 1fr 300px; }
  #chat { display: flex; flex-direction: column; min-height: 0; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.bot.rich { white-space: normal; }
  .msg .gap { height: .6em; }
  .msg .li::before { content: "\2022  "; }
  .msg.bot { background: var(--bot); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .events { align-self: flex-start; display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--ok); }
  .typing { color: var(--muted); font-style: italic; }
  #composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #composer textarea { resize: none; height: 46px; }
  aside { border-left: 1px solid var(--border); padding: 16px; overflow-y: auto; }
  aside h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
  aside p.hint { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
  .pref { padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; background: var(--bot); font-size: 14px; }
  .pref.hard { background: var(--hard); }
  .pref small { color: var(--muted); display: block; }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--border); max-height: 28vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Sham <span>Al-Khaleej</span> · Ordering Assistant</h1>
  <button id="newChat" style="display:none">New conversation</button>
  <button id="switchUser" style="display:none">Switch user</button>
</header>

<section id="login">
  <h2>Welcome</h2>
  <p>Enter a username. Use the same one next time and the assistant will remember you.</p>
  <form id="loginForm">
    <input id="username" placeholder="e.g. Mohammed" autocomplete="off" required minlength="2" maxlength="40">
    <button class="primary" type="submit">Start</button>
    <div class="err" id="loginError"></div>
  </form>
</section>

<main id="app">
  <div id="chat">
    <div id="messages"></div>
    <form id="composer">
      <textarea id="input" dir="auto" placeholder="Tell me what you feel like eating… / اكتب ما تشتهيه…" rows="1"></textarea>
      <button class="primary" id="send" type="submit">Send</button>
    </form>
  </div>
  <aside>
    <h2>What I remember</h2>
    <p class="hint">Live view of this guest's saved preferences. It updates as you chat.</p>
    <div id="memory"></div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
let username = null, conversationId = null, busy = false;

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
}
const post = (path, body) => api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

// Safe mini-renderer: **bold** and "- " / "• " bullets. Each line gets its own text direction,
// so mixed Arabic/English lines (dish names in Latin, sentences in Arabic) lay out correctly.
function renderRich(el, text) {
  el.classList.add('rich');
  for (const raw of text.split('\n')) {
    const line = document.createElement('div');
    line.dir = 'auto';
    let t = raw;
    if (!t.trim()) { line.className = 'gap'; el.appendChild(line); continue; }
    const m = t.match(/^\s*[-•*]\s+(.*)$/);
    if (m) { line.className = 'li'; t = m[1]; }
    t.split('**').forEach((part, i) => {
      if (!part) return;
      if (i % 2) { const b = document.createElement('strong'); b.textContent = part; line.appendChild(b); }
      else line.appendChild(document.createTextNode(part));
    });
    el.appendChild(line);
  }
}

function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.dir = 'auto';
  if (role === 'bot' && text !== 'Thinking…') renderRich(d, text); else d.textContent = text;
  $('messages').appendChild(d);
  $('messages').scrollTop = $('messages').scrollHeight;
  return d;
}

function addEvents(events) {
  if (!events || !events.length) return;
  const wrap = document.createElement('div');
  wrap.className = 'events';
  const verbs = { added: 'Saved', updated: 'Updated', confirmed: 'Confirmed', removed: 'Removed', not_found: 'Not found' };
  for (const e of events) {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = `${verbs[e.action] || e.action}: ${e.kind} · ${e.subject}`;
    wrap.appendChild(c);
  }
  $('messages').appendChild(wrap);
}

function renderMemory(prefs, combos) {
  const box = $('memory');
  box.innerHTML = '';
  combos = combos || [];
  if (!prefs.length && !combos.length) { box.textContent = 'Nothing yet.'; return; }
  for (const p of prefs) {
    const d = document.createElement('div');
    d.className = 'pref' + (p.strength === 'hard' ? ' hard' : '');
    let title = p.subject;
    if (p.value) title += ' ' + JSON.stringify(p.value);
    d.textContent = title;
    const s = document.createElement('small');
    s.textContent = `${p.kind} · ${p.kind === 'diet' || p.kind === 'allergen' ? 'must follow' : p.polarity}${p.strength === 'hard' && p.kind !== 'diet' && p.kind !== 'allergen' ? ' · hard' : ''}`;
    d.appendChild(s);
    box.appendChild(d);
  }
  if (combos.length) {
    const h = document.createElement('h2');
    h.textContent = 'Usual pairings';
    h.style.marginTop = '16px';
    box.appendChild(h);
    for (const c of combos) {
      const d = document.createElement('div');
      d.className = 'pref';
      d.textContent = c.names.join(' + ');
      const s = document.createElement('small');
      s.textContent = c.detail;
      d.appendChild(s);
      box.appendChild(d);
    }
  }
}

async function refreshMemory() {
  try { const d = await api('/api/memory?username=' + encodeURIComponent(username)); renderMemory(d.memory, d.combos); } catch (e) {}
}

function showApp() {
  $('login').style.display = 'none';
  $('app').style.display = 'grid';
  $('newChat').style.display = $('switchUser').style.display = '';
  $('input').focus();
}

function greet(isReturning) {
  addMsg('bot', isReturning
    ? `Welcome back, ${username}! What are you in the mood for today?`
    : `Welcome to Sham Al-Khaleej! Tell me what you like (or can't eat) and I'll find something you'll enjoy.`);
}

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginError').textContent = '';
  try {
    const d = await post('/api/login', { username: $('username').value });
    username = d.username; conversationId = null;
    $('messages').innerHTML = '';
    showApp(); renderMemory(d.memory, d.combos); greet(d.is_returning);
  } catch (err) { $('loginError').textContent = err.message; }
});

async function send() {
  const text = $('input').value.trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true; $('input').value = '';
  addMsg('user', text);
  const typing = addMsg('bot', 'Thinking…'); typing.classList.add('typing');
  try {
    const d = await post('/api/chat', { username, message: text, conversation_id: conversationId });
    conversationId = d.conversation_id;
    typing.remove();
    addMsg('bot', d.reply);
    addEvents(d.memory_events);
    refreshMemory();
  } catch (err) {
    typing.textContent = 'Error: ' + err.message; typing.classList.remove('typing');
  } finally { busy = false; $('send').disabled = false; $('input').focus(); }
}

$('composer').addEventListener('submit', e => { e.preventDefault(); send(); });
$('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
$('newChat').addEventListener('click', () => { conversationId = null; $('messages').innerHTML = ''; greet(true); });
$('switchUser').addEventListener('click', () => {
  username = null; conversationId = null; $('messages').innerHTML = '';
  $('app').style.display = 'none'; $('login').style.display = '';
  $('newChat').style.display = $('switchUser').style.display = 'none';
  $('username').value = ''; $('username').focus();
});
</script>
</body>
</html>
