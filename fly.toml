# fly.toml app configuration file generated for sham-al-khaleej-agent on 2026-10-23T06:02:42+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sham-al-khaleej-agent'
primary_region = 'fra'

[build]
[env]
  DB_PATH = '/data/app.db'
  DEEPSEEK_MODEL = 'deepseek-flash'
  DEEPSEEK_THINKING = 'disabled'

[[mounts]]
  source = 'agent_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
